# Ceiling markers of a small office: twenty tag36h11 boards (40 cm black square
# on a 50 cm sheet) on a 1.4 m grid under a flat 2.9 m ceiling, for a camera
# held 1.0 m above the floor (marker_plan --ceiling 2.9 --handheld --size 0.40).
# Marker 0, near the middle, is the origin: its frame is this map's frame.
version: 1
frame_id: map                 # the frame the robot's map uses
dictionary: tag36h11          # printed family
marker_size: 0.40             # [m] edge of the black square, measured
mount: ceiling                # default for every marker below
markers:
  - {id:  1, x: -2.800, y: -1.400, z: 2.900, rotation_deg:   45.0}
  - {id:  2, x: -1.400, y: -1.400, z: 2.900, rotation_deg:  143.0}
  - {id:  3, x:  0.000, y: -1.400, z: 2.900, rotation_deg:   99.2}
  - {id:  4, x:  1.400, y: -1.400, z: 2.900, rotation_deg:  -98.9}
  - {id:  5, x:  2.800, y: -1.400, z: 2.900, rotation_deg:  -71.9}
  - {id:  6, x: -2.800, y:  0.000, z: 2.900, rotation_deg:  134.5}
  - {id:  7, x: -1.400, y:  0.000, z: 2.900, rotation_deg: -178.1}
  - {id:  0, x:  0.000, y:  0.000, z: 2.900, rotation_deg:    0.0}
  - {id:  8, x:  1.400, y:  0.000, z: 2.900, rotation_deg:  115.6}
  - {id:  9, x:  2.800, y:  0.000, z: 2.900, rotation_deg:  106.9}
  - {id: 10, x: -2.800, y:  1.400, z: 2.900, rotation_deg:  -11.5}
  - {id: 11, x: -1.400, y:  1.400, z: 2.900, rotation_deg:  -70.9}
  - {id: 12, x:  0.000, y:  1.400, z: 2.900, rotation_deg:  -79.8}
  - {id: 13, x:  1.400, y:  1.400, z: 2.900, rotation_deg:  -88.2}
  - {id: 14, x:  2.800, y:  1.400, z: 2.900, rotation_deg:  -19.8}
  - {id: 15, x: -2.800, y:  2.800, z: 2.900, rotation_deg:    1.6}
  - {id: 16, x: -1.400, y:  2.800, z: 2.900, rotation_deg:   19.3}
  - {id: 17, x:  0.000, y:  2.800, z: 2.900, rotation_deg:  178.4}
  - {id: 18, x:  1.400, y:  2.800, z: 2.900, rotation_deg:  105.4}
  - {id: 19, x:  2.800, y:  2.800, z: 2.900, rotation_deg:   44.0}
