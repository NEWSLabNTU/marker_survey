# Ceiling markers of the office: nine tags under a flat 3 m ceiling.
version: 1
frame_id: map                 # the frame the robot's map uses
dictionary: tag36h11          # printed family
marker_size: 0.45             # [m] edge of the black square, measured
mount: ceiling                # default for every marker below
markers:
  - {id: 0, x: -4.000, y:  1.500, z: 3.000, rotation_deg:   0.0}
  - {id: 1, x: -1.500, y:  1.500, z: 3.000, rotation_deg:  45.8}
  - {id: 2, x:  1.500, y:  2.500, z: 3.000, rotation_deg:   0.0}
  - {id: 3, x:  4.000, y:  1.000, z: 3.000, rotation_deg: -34.4}
  - {id: 4, x:  3.000, y: -2.000, z: 3.000, rotation_deg:  91.7}
  - {id: 5, x:  0.000, y: -0.500, z: 3.000, rotation_deg:   0.0}
  - {id: 6, x: -1.000, y: -3.000, z: 3.000, rotation_deg: -68.8}
  - {id: 7, x: -3.500, y: -1.500, z: 3.000, rotation_deg:  22.9}
  - {id: 8, x:  0.300, y:  3.000, z: 3.000, rotation_deg:  17.2}
