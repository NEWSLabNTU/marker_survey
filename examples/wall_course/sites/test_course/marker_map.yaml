# Boards around the test course: a 10 m x 4 m oval (route.csv) in a hall
# of at least 14 m x 8 m. Centres 0.25 m above the floor; the side-wall
# boards are angled about 45 deg towards the oncoming robot.
version: 1
frame_id: map                 # the frame the robot's map uses
dictionary: DICT_5X5_1000     # printed family
marker_size: 0.38             # [m] edge of the black square, measured
mount: wall                   # default for every marker below
markers:
  # end walls, seen in the turns
  - {id: 0,  x: 10.000, y:  0.500, z: 0.250, facing_deg: 180.0}
  - {id: 1,  x: 10.000, y:  3.500, z: 0.250, facing_deg: 180.0}
  - {id: 2,  x: -4.000, y:  3.500, z: 0.250, facing_deg:   0.0}
  - {id: 3,  x: -4.000, y:  0.500, z: 0.250, facing_deg:   0.0}
  # the y = -2 wall, angled towards a robot driving +x
  - {id: 4,  x:  2.000, y: -2.000, z: 0.250, facing_deg: 135.0}
  - {id: 5,  x:  5.000, y: -2.000, z: 0.250, facing_deg: 135.0}
  - {id: 6,  x:  8.000, y: -2.000, z: 0.250, facing_deg: 120.0}
  - {id: 10, x:  4.000, y: -2.000, z: 0.250, facing_deg: 135.0}   # by the start; the origin in the examples
  # the y = 6 wall, angled towards a robot driving -x
  - {id: 7,  x:  4.000, y:  6.000, z: 0.250, facing_deg: -45.0}
  - {id: 8,  x:  1.000, y:  6.000, z: 0.250, facing_deg: -45.0}
  - {id: 9,  x: -2.000, y:  6.000, z: 0.250, facing_deg: -60.0}
