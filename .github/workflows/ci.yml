name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  neutral-wording:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Banned words and personal data
        run: python3 ci/check_words.py --commits
      - name: Lint
        run: |
          python3 -m pip install --quiet flake8
          python3 -m flake8 --max-line-length 110 --select E,W,F --extend-ignore E741,W503,W504 \
            marker_survey marker_localizer marker_survey_web ci

  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        distro: [humble, jazzy]
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    container: ros:${{ matrix.distro }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - name: Dependencies
        run: ci/install_deps.sh ${{ matrix.distro }}
      - name: Build
        run: |
          source /opt/ros/${{ matrix.distro }}/setup.bash
          colcon build --event-handlers console_cohesion+
      - name: Unit tests
        run: |
          source /opt/ros/${{ matrix.distro }}/setup.bash
          colcon test --event-handlers console_cohesion+
          colcon test-result --verbose

  synthetic-survey:
    needs: build-and-test
    strategy:
      fail-fast: false
      matrix:
        distro: [humble, jazzy]
        scene: [wall, ceiling_pose_frame, ceiling_align, ceiling_uneven]
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    container: ros:${{ matrix.distro }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - name: Dependencies
        run: ci/install_deps.sh ${{ matrix.distro }}
      - name: Build
        run: |
          source /opt/ros/${{ matrix.distro }}/setup.bash
          colcon build --event-handlers console_cohesion+
      - name: Rendered recording through the survey node
        run: |
          source install/setup.bash
          ci/synthetic_survey.sh ${{ matrix.scene }} ci_out
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: survey-${{ matrix.scene }}-${{ matrix.distro }}
          path: |
            ci_out/*/result/
            ci_out/*/truth_*.yaml
            ci_out/*/node.log

  synthetic-localize:
    needs: build-and-test
    strategy:
      fail-fast: false
      matrix:
        distro: [humble, jazzy]
        scene: [ceiling, ceiling_gate, wall]
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    container: ros:${{ matrix.distro }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - name: Dependencies
        run: ci/install_deps.sh ${{ matrix.distro }}
      - name: Build
        run: |
          source /opt/ros/${{ matrix.distro }}/setup.bash
          colcon build --event-handlers console_cohesion+
      - name: Rendered recording through the localizer node
        run: |
          source install/setup.bash
          ci/synthetic_localize.sh ${{ matrix.scene }} ci_out
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: localize-${{ matrix.scene }}-${{ matrix.distro }}
          path: |
            ci_out/*/truth_poses.csv
            ci_out/*/node.log
            ci_out/*/poses/

  localizer-comparison:
    needs: build-and-test
    strategy:
      fail-fast: false
      matrix:
        distro: [humble, jazzy]
        scene: [ceiling, wall]
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    container: ros:${{ matrix.distro }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - name: Dependencies
        run: ci/install_deps.sh ${{ matrix.distro }}
      - name: Against the source implementations' methods, rendered frames
        run: ci/localizer_comparison.sh ${{ matrix.scene }} ci_out

  example:
    needs: build-and-test
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        distro: [humble, jazzy]
        example: [wall_course, ceiling]
    runs-on: ubuntu-24.04
    container: ros:${{ matrix.distro }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - name: Dependencies with rosdep, as docs/integration.md does
        run: |
          apt-get update
          rosdep update --rosdistro ${{ matrix.distro }}
          rosdep install --from-paths . --ignore-src -y --rosdistro ${{ matrix.distro }}
      - name: Build
        run: |
          source /opt/ros/${{ matrix.distro }}/setup.bash
          colcon build --event-handlers console_cohesion+
      - name: The example's launch files on its simulated recording
        run: |
          source install/setup.bash
          ci/example.sh ${{ matrix.example }} ci_out
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: example-${{ matrix.example }}-${{ matrix.distro }}
          path: |
            ci_out/*/survey/
            ci_out/*/sim/truth_*.yaml
            ci_out/*/*.log

  timing:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    timeout-minutes: 30
    runs-on: ${{ matrix.runner }}
    container: ros:jazzy
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - name: Dependencies
        run: ci/install_deps.sh jazzy
      - name: CPU
        run: lscpu | grep -E 'Architecture|Model name|^CPU\(s\)' || true
      - name: Detection and fit per frame, one core
        run: ci/timing.sh 0

  web-browser:
    needs: build-and-test
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        distro: [humble, jazzy]
    runs-on: ubuntu-24.04
    container: ros:${{ matrix.distro }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - name: Dependencies with rosdep
        run: |
          apt-get update
          rosdep update --rosdistro ${{ matrix.distro }}
          rosdep install --from-paths . --ignore-src -y --rosdistro ${{ matrix.distro }}
      - name: Playwright and Chromium (the test only; the page itself needs neither)
        run: |
          apt-get install -y --no-install-recommends python3-pip
          python3 -m pip install --break-system-packages playwright==1.48.0 \
            || python3 -m pip install playwright==1.48.0
          python3 -m playwright install --with-deps chromium
      - name: Build
        run: |
          source /opt/ros/${{ matrix.distro }}/setup.bash
          colcon build --event-handlers console_cohesion+
      - name: Survey, check and use the map from the browser, on simulated recordings
        run: |
          source install/setup.bash
          ci/web_browser.sh ci_out
      - name: The handheld case from the browser (plan, a camera-only survey, the localization test)
        if: success() || failure()
        run: |
          source install/setup.bash
          ci/web_handheld.sh ci_out
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: web-browser-${{ matrix.distro }}
          path: |
            ci_out/web/shots/
            ci_out/web/*.log
            ci_out/web/site/
            ci_out/handheld/shots/
            ci_out/handheld/*.log
            ci_out/handheld/*.csv
