name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  neutral-wording:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Banned words and personal data
        run: python3 ci/check_words.py --commits
      - name: Lint
        run: |
          python3 -m pip install --quiet flake8
          python3 -m flake8 --max-line-length 110 --select E,W,F --extend-ignore E741,W503,W504 \
            marker_survey marker_localizer marker_survey_web ci

  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        distro: [humble, jazzy]
    runs-on: ubuntu-24.04
    container: ros:${{ matrix.distro }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - name: Dependencies
        run: ci/install_deps.sh ${{ matrix.distro }}
      - name: Build
        run: |
          source /opt/ros/${{ matrix.distro }}/setup.bash
          colcon build --event-handlers console_cohesion+
      - name: Unit tests
        run: |
          source /opt/ros/${{ matrix.distro }}/setup.bash
          colcon test --event-handlers console_cohesion+
          colcon test-result --verbose

  synthetic-survey:
    needs: build-and-test
    strategy:
      fail-fast: false
      matrix:
        distro: [humble, jazzy]
        scene: [wall]
    runs-on: ubuntu-24.04
    container: ros:${{ matrix.distro }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - name: Dependencies
        run: ci/install_deps.sh ${{ matrix.distro }}
      - name: Build
        run: |
          source /opt/ros/${{ matrix.distro }}/setup.bash
          colcon build --event-handlers console_cohesion+
      - name: Rendered recording through the survey node
        run: |
          source install/setup.bash
          ci/synthetic_survey.sh ${{ matrix.scene }} ci_out
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: survey-${{ matrix.scene }}-${{ matrix.distro }}
          path: |
            ci_out/*/result/
            ci_out/*/truth_*.yaml
            ci_out/*/node.log
